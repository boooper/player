name: publish

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - run: bun install

      - name: write updater pubkey into config
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src = Path("apps/desktop/src-tauri/tauri.release.conf.json")
          dst = Path("apps/desktop/src-tauri/tauri.release.generated.conf.json")
          d = json.loads(src.read_text())
          d.setdefault("plugins", {}).setdefault("updater", {})["pubkey"] = os.environ["TAURI_UPDATER_PUBKEY"]
          dst.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: true
          prerelease: false
          args: >-
            --config src-tauri/tauri.build.conf.json
            --config src-tauri/tauri.release.generated.conf.json
            --target ${{ matrix.target }}

  # ── Generate latest.json and publish the draft ──────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: get version
        id: ver
        run: |
          version=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"

      - name: download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist

      - name: generate latest.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version  = os.environ["VERSION"]
          tag      = os.environ["TAG"]
          base_url = f"https://github.com/boooper/player/releases/download/{tag}"
          dist     = Path("dist")

          def pick(suffix, hint=None):
              hits = sorted(dist.rglob(f"*{suffix}"))
              if hint:
                  hits = [p for p in hits if hint in p.name] or hits
              if not hits:
                  raise SystemExit(f"no file matching *{suffix}")
              return hits[0]

          bundles = {
              "linux-x86_64":   pick(".AppImage"),
              "darwin-aarch64": pick(".app.tar.gz", "aarch64"),
              "darwin-x86_64":  pick(".app.tar.gz", "x86_64"),
              "windows-x86_64": pick(".nsis.zip"),
          }

          platforms = {}
          for target, f in bundles.items():
              sig = Path(str(f) + ".sig")
              if not sig.exists():
                  raise SystemExit(f"missing sig for {f.name}")
              platforms[target] = {
                  "signature": sig.read_text().strip(),
                  "url": f"{base_url}/{f.name}",
              }

          Path("latest.json").write_text(json.dumps({
              "version":   version,
              "notes":     f"Madrify {version}",
              "pub_date":  datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, indent=2) + "\n")
          PY

      - name: upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false
