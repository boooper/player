name: publish

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate next tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"

          if [[ -n "$latest_tag" ]]; then
            base="${latest_tag#v}"
          else
            base="$(python3 -c "import json; print(json.load(open('apps/desktop/package.json'))['version'])")"
          fi

          IFS='.' read -r major minor patch <<< "$base"
          version="${major}.${minor}.$((patch + 1))"
          tag="v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: install frontend dependencies
        run: bun install

      - name: stamp release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]

          package_json = Path("apps/desktop/package.json")
          package_data = json.loads(package_json.read_text())
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n")

          tauri_conf = Path("apps/desktop/src-tauri/tauri.conf.json")
          tauri_data = json.loads(tauri_conf.read_text())
          tauri_data["version"] = version
          tauri_conf.write_text(json.dumps(tauri_data, indent=2) + "\n")

          cargo_toml = Path("apps/desktop/src-tauri/Cargo.toml")
          text = cargo_toml.read_text()
          text, count = re.subn(r'^version = ".*?"$', f'version = "{version}"', text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("Failed to update Cargo.toml version")
          cargo_toml.write_text(text)
          PY

      - name: generate release updater config
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = Path("apps/desktop/src-tauri/tauri.release.conf.json")
          dst = Path("apps/desktop/src-tauri/tauri.release.generated.conf.json")

          data = json.loads(src.read_text())
          data.setdefault("plugins", {}).setdefault("updater", {})["pubkey"] = os.environ["TAURI_UPDATER_PUBKEY"]
          dst.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: materialize updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export KEY_PATH="$RUNNER_TEMP/tauri-signing.key"
          python3 - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ["TAURI_SIGNING_PRIVATE_KEY"]
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")

          path = Path(os.environ["KEY_PATH"])
          path.write_text(raw)
          path.chmod(0o600)
          PY
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.build.conf.json --config src-tauri/tauri.release.generated.conf.json --target ${{ matrix.target }}

  generate-latest-json:
    needs:
      - prepare-release
      - build-tauri
    runs-on: ubuntu-latest

    steps:
      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG_NAME" --dir dist

      - name: generate updater manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          base_url = f"https://github.com/boooper/player/releases/download/{tag}"
          dist = Path("dist")

          bundles = {
            "linux-x86_64": ".AppImage",
            "darwin-aarch64": ".app.tar.gz",
            "darwin-x86_64": ".app.tar.gz",
            "windows-x86_64": ".nsis.zip",
          }

          def pick_file(suffix, needle=None):
              candidates = sorted(dist.rglob(f"*{suffix}"))
              if needle:
                  filtered = [p for p in candidates if needle in str(p)]
                  if filtered:
                      return filtered[0]
              if not candidates:
                  raise SystemExit(f"Missing bundle for suffix {suffix}")
              return candidates[0]

          platforms = {
            "linux-x86_64": pick_file(".AppImage"),
            "darwin-aarch64": pick_file(".app.tar.gz", "aarch64"),
            "darwin-x86_64": pick_file(".app.tar.gz", "x64"),
            "windows-x86_64": pick_file(".nsis.zip"),
          }

          manifest_platforms = {}
          for target, bundle in platforms.items():
              sig_path = Path(f"{bundle}.sig")
              if not sig_path.is_file():
                  raise SystemExit(f"Missing signature for {bundle}")
              manifest_platforms[target] = {
                  "signature": sig_path.read_text().strip(),
                  "url": f"{base_url}/{bundle.name}",
              }

          manifest = {
            "version": version,
            "notes": f"Madrify {version}",
            "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": manifest_platforms,
          }

          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$TAG_NAME" latest.json --clobber
