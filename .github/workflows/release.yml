name: publish

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── 1. Calculate version and push the git tag ──────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: calculate version and push tag
        id: calc
        shell: bash
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [[ -n "$latest" ]]; then
            base="${latest#v}"
          else
            base=$(python3 -c "import json; print(json.load(open('apps/desktop/package.json'))['version'])")
          fi

          IFS='.' read -r major minor patch <<< "$base"
          version="${major}.${minor}.$((patch + 1))"
          tag="v${version}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag" -m "$tag"
          git push origin "$tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"

  # ── 2. Build all platforms ─────────────────────────────────────────────────
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - run: bun install

      - name: stamp version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          v = os.environ["VERSION"]

          for f in ["apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json"]:
              p = Path(f)
              d = json.loads(p.read_text())
              d["version"] = v
              p.write_text(json.dumps(d, indent=2) + "\n")

          p = Path("apps/desktop/src-tauri/Cargo.toml")
          text, n = re.subn(r'^version = ".*?"$', f'version = "{v}"', p.read_text(), count=1, flags=re.MULTILINE)
          if n != 1:
              raise SystemExit("Cargo.toml version not patched")
          p.write_text(text)
          PY

      - name: write updater pubkey into config
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src = Path("apps/desktop/src-tauri/tauri.release.conf.json")
          dst = Path("apps/desktop/src-tauri/tauri.release.generated.conf.json")
          d = json.loads(src.read_text())
          d.setdefault("plugins", {}).setdefault("updater", {})["pubkey"] = os.environ["TAURI_UPDATER_PUBKEY"]
          dst.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - name: write signing key to file
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/tauri.key"
          raw="$TAURI_SIGNING_PRIVATE_KEY"
          printf '%s' "$raw" > "$KEY"
          chmod 600 "$KEY"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: >-
            --config src-tauri/tauri.build.conf.json
            --config src-tauri/tauri.release.generated.conf.json
            --target ${{ matrix.target }}

  # ── 3. Generate latest.json and publish ────────────────────────────────────
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir dist
          gh release download "$TAG" --dir dist

      - name: generate latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version  = os.environ["VERSION"]
          tag      = os.environ["TAG"]
          base_url = f"https://github.com/boooper/player/releases/download/{tag}"
          dist     = Path("dist")

          def pick(suffix, hint=None):
              hits = sorted(dist.rglob(f"*{suffix}"))
              if hint:
                  hits = [p for p in hits if hint in p.name] or hits
              if not hits:
                  raise SystemExit(f"no file matching *{suffix}")
              return hits[0]

          bundles = {
              "linux-x86_64":   pick(".AppImage"),
              "darwin-aarch64": pick(".app.tar.gz", "aarch64"),
              "darwin-x86_64":  pick(".app.tar.gz", "x86_64"),
              "windows-x86_64": pick(".nsis.zip"),
          }

          platforms = {}
          for target, f in bundles.items():
              sig = Path(str(f) + ".sig")
              if not sig.exists():
                  raise SystemExit(f"missing sig for {f.name}")
              platforms[target] = {
                  "signature": sig.read_text().strip(),
                  "url": f"{base_url}/{f.name}",
              }

          Path("latest.json").write_text(json.dumps({
              "version":   version,
              "notes":     f"Madrify {version}",
              "pub_date":  datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, indent=2) + "\n")
          PY

      - name: upload latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false
