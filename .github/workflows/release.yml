name: publish

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Create the draft release ─────────────────────────────────────────────
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: get version
        id: get-version
        run: |
          version=$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: create release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              name: `v${process.env.VERSION}`,
              body: `Madrify ${process.env.VERSION}`,
              draft: true,
              prerelease: false
            })
            return data.id

  # ── 2. Build all platforms ───────────────────────────────────────────────────
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - run: bun install

      - name: write updater pubkey into config
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          src = Path("apps/desktop/src-tauri/tauri.release.conf.json")
          dst = Path("apps/desktop/src-tauri/tauri.release.generated.conf.json")
          d = json.loads(src.read_text())
          d.setdefault("plugins", {}).setdefault("updater", {})["pubkey"] = os.environ["TAURI_UPDATER_PUBKEY"]
          dst.write_text(json.dumps(d, indent=2) + "\n")
          PY

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: >-
            --config src-tauri/tauri.build.conf.json
            --config src-tauri/tauri.release.generated.conf.json
            --target ${{ matrix.target }}

  # ── 3. Generate latest.json and publish ─────────────────────────────────────
  publish:
    needs: [create-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir dist
          gh release download "v$VERSION" --dir dist

      - name: generate latest.json
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version  = os.environ["VERSION"]
          tag      = f"v{version}"
          base_url = f"https://github.com/boooper/player/releases/download/{tag}"
          dist     = Path("dist")

          def pick(suffix, hint=None):
              hits = sorted(dist.rglob(f"*{suffix}"))
              if hint:
                  hits = [p for p in hits if hint in p.name] or hits
              if not hits:
                  raise SystemExit(f"no file matching *{suffix}")
              return hits[0]

          bundles = {
              "linux-x86_64":   pick(".AppImage"),
              "darwin-aarch64": pick(".app.tar.gz", "aarch64"),
              "darwin-x86_64":  pick(".app.tar.gz", "x86_64"),
              "windows-x86_64": pick(".nsis.zip"),
          }

          platforms = {}
          for target, f in bundles.items():
              sig = Path(str(f) + ".sig")
              if not sig.exists():
                  raise SystemExit(f"missing sig for {f.name}")
              platforms[target] = {
                  "signature": sig.read_text().strip(),
                  "url": f"{base_url}/{f.name}",
              }

          Path("latest.json").write_text(json.dumps({
              "version":   version,
              "notes":     f"Madrify {version}",
              "pub_date":  datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, indent=2) + "\n")
          PY

      - name: upload latest.json and publish release
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs')
            const tag = `v${process.env.VERSION}`

            // Upload latest.json
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              name: 'latest.json',
              data: fs.readFileSync('latest.json')
            })

            // Publish the release
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false
            })
