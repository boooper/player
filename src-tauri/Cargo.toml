[package]
name = "madrify"
version = "0.1.0"
description = "Madrify — Music Recommendations for Navidrome/Subsonic"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "madrify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
# musixmatch supports rustls — disable default native-tls so it doesn't pull in openssl-sys
musixmatch-inofficial = { version = "0.4.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
url = "2"
md5 = "0.8"
rand = "0.9"

biquad = "0.5"
cpal = "0.17"
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
walkdir = "2"
lofty = "0.21"
base64 = "0.22"
roxmltree = "0.21"
opensubsonic = "0.1.0"
jellyfin-sdk = "0.1.0"
regex = "1"
unicode-normalization = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-drpc = "*"
tauri-plugin-positioner = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rust_cast = { version = "0.21.0", features = ["thread_safe"] }
if-addrs = "0.13"
rustls = { version = "0.23", features = ["ring"] }
# These crates use reqwest with native-tls (no rustls feature) — desktop-only
lastfm-client = "3.5.0"
rustfm-scrobble = "1.1.1"
genius_lyrics = "1.0.4"
