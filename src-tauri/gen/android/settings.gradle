include ':app'

apply from: 'tauri.settings.gradle'

// Add local Maven repo for rustls-platform-verifier Android AAR (bundled with crate, not on Maven Central)
def rustlsMavenPath = null
def rustlsVersion = null
try {
    def cargoHome = System.getenv("CARGO_HOME") ?: "${System.getProperty('user.home')}/.cargo"
    def registryRoot = new File("${cargoHome}/registry/src")
    if (registryRoot.exists()) {
        registryRoot.eachDir { indexDir ->
            indexDir.eachDir { pkgDir ->
                if (pkgDir.name.startsWith("rustls-platform-verifier-android-")) {
                    def candidate = new File(pkgDir, "maven")
                    if (candidate.exists()) {
                        rustlsMavenPath = candidate.absolutePath
                        rustlsVersion = pkgDir.name.replaceFirst("rustls-platform-verifier-android-", "")
                    }
                }
            }
        }
    }
} catch (e) {
    println("Warning: Could not find rustls-platform-verifier-android: ${e.message}")
}

if (rustlsMavenPath) {
    gradle.ext.rustlsPlatformVerifierVersion = rustlsVersion
    gradle.allprojects { project ->
        project.repositories {
            maven {
                url = new File(rustlsMavenPath).toURI()
                metadataSources { artifact() }
            }
        }
    }
}
